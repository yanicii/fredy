services:
  fredy:
    container_name: fredy
    build:
      context: .
      dockerfile: Dockerfile
    # Tagged under OUR namespace on purpose. This compose BUILDS from the
    # local source (see build: above) - the tag is just a local name. Tagging
    # it ghcr.io/orangecoding/fredy would mean a stray `docker compose pull`
    # silently replaces this fork's build with upstream's image.
    image: ghcr.io/yanicii/fredy:local
    pull_policy: never
    environment:
      - NODE_ENV=production
    volumes:
      - ./conf:/conf
      - ./db:/db
    ports:
      - "9998:9998"
    restart: unless-stopped
    # Resource limits to prevent runaway memory usage from Chromium
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:9998/"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
